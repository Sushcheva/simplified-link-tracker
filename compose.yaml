name: simplified-link-tracker

x-app-environment: &app-environment
  DATABASE_URL: jdbc:postgresql://postgresql:5432/${DATABASE_NAME:-linktracker}
  DATABASE_USER: ${DATABASE_USER:-linktracker}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Create .env from .env.example and set DATABASE_PASSWORD}

services:
  postgresql:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-linktracker}
      POSTGRES_USER: ${DATABASE_USER:-linktracker}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    image: simplified-link-tracker:${RELEASE_VERSION:-1.0.0}
    environment:
      <<: *app-environment
      APP_MODE: migrate
      MIGRATIONS_ENABLED: "true"
      SCHEDULER_ENABLED: "false"
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    depends_on:
      postgresql:
        condition: service_healthy
    restart: "no"

  app:
    image: simplified-link-tracker:${RELEASE_VERSION:-1.0.0}
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      <<: *app-environment
      APP_MODE: web
      MIGRATIONS_ENABLED: "false"
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-60s}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
