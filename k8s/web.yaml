apiVersion: apps/v1
kind: Deployment
metadata:
  name: link-tracker-web
  namespace: link-tracker
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: link-tracker-web
  template:
    metadata:
      labels:
        app: link-tracker-web
        release: __RELEASE_ID__
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: web
          image: __APP_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: link-tracker-config-__RELEASE_ID__
            - secretRef:
                name: link-tracker-secrets
          env:
            - name: APP_MODE
              value: web
            - name: SCHEDULER_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: link-tracker-web
  namespace: link-tracker
spec:
  type: ClusterIP
  selector:
    app: link-tracker-web
  ports:
    - name: http
      port: 80
      targetPort: http
