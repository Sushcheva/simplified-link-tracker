apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: link-tracker
spec:
  clusterIP: None
  selector:
    app: link-tracker-postgresql
  ports:
    - port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: link-tracker
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: link-tracker-postgresql
  template:
    metadata:
      labels:
        app: link-tracker-postgresql
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: postgres:16.4
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: linktracker
            - name: POSTGRES_USER
              value: linktracker
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: link-tracker-secrets
                  key: DATABASE_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            exec:
              command: [pg_isready, -U, linktracker, -d, linktracker]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [pg_isready, -U, linktracker, -d, linktracker]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
