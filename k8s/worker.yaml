apiVersion: apps/v1
kind: Deployment
metadata:
  name: link-tracker-worker
  namespace: link-tracker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: link-tracker-worker
  template:
    metadata:
      labels:
        app: link-tracker-worker
        release: __RELEASE_ID__
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: __APP_IMAGE__
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: link-tracker-config-__RELEASE_ID__
            - secretRef:
                name: __SECRET_NAME__
          env:
            - name: APP_MODE
              value: worker
            - name: SCHEDULER_ENABLED
              value: "true"
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
