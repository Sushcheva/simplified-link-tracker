apiVersion: v1
kind: ConfigMap
metadata:
  name: link-tracker-config-__RELEASE_ID__
  namespace: link-tracker
immutable: true
data:
  DATABASE_URL: jdbc:postgresql://postgresql:5432/linktracker
  DATABASE_USER: linktracker
  DB_POOL_SIZE: "5"
  PORT: "8080"
  MIGRATIONS_ENABLED: "false"
  SCHEDULER_INTERVAL: 60s
  SCHEDULER_BATCH_SIZE: "20"
  GITHUB_API_URL: https://api.github.com
  STACKOVERFLOW_API_URL: https://api.stackexchange.com/2.3
  API_CONNECT_TIMEOUT: 2s
  API_READ_TIMEOUT: 5s
  LOG_LEVEL: INFO
  SESSION_TIMEOUT: 30m
  SESSION_COOKIE_SECURE: "false"
